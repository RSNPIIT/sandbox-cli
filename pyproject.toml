[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sandbox-cli"
version = "0.1.0"
description = "An encrypted, append-only, deletion-resistant single-file vault."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Sandbox CLI contributors" }]
keywords = ["vault", "encryption", "cli", "rust", "chacha20"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=13,<16",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8,<10",
]

[project.scripts]
sandbox-cli = "sandbox_cli.main:cli"

[tool.maturin]
python-source = "."
module-name = "sandbox_cli.sandbox_engine"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
